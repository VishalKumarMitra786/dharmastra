name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node src/test/run.mjs
      - name: Size and licence budget
        run: node tools/check-budget.mjs
      - name: Browser smoke test (phone and desktop, a11y basics, fallbacks)
        run: node tools/smoke.mjs
      - name: Keep screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: tools/out/
          if-no-files-found: ignore
