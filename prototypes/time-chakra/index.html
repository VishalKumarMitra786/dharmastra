<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dharmastra time chakra</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0914;--panel:#15122a;--line:#2e2859;--gold:#e8b84a;--text:#efe9d8;--mute:#a79fc4}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 28%,#1d1646 0,#0a0914 62%) fixed;color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:18px 14px 48px}
h1{font-family:Cinzel,Georgia,serif;font-weight:700;letter-spacing:.2em;text-align:center;margin:4px 0 2px;color:var(--gold);font-size:26px}
.sub{text-align:center;color:var(--mute);font-size:13px;margin:0 0 6px}
.stage{position:relative;margin:0 -4px}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
.spin{transform-origin:200px 200px;animation:sp 120s linear infinite}
.spin.rev{animation-duration:70s;animation-direction:reverse}
.spin.slow{animation-duration:200s}
@keyframes sp{to{transform:rotate(360deg)}}
.halo{animation:hp 2.2s ease-in-out infinite}
@keyframes hp{0%,100%{opacity:.15}50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.spin,.halo{animation:none}#tip{transition:none}}
.paused .spin,.paused .halo{animation-play-state:paused}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tile:focus-visible{outline:none;stroke:#fff;stroke-width:2.6}
.dot:focus-visible{outline:none}
.dot:focus-visible .halo{animation:none;opacity:.95}
button,select{min-height:44px}
select{font:inherit;color:var(--text);background:#0d0b1f;border:1px solid var(--line);border-radius:10px;padding:0 10px;width:100%}
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin:0 0 12px}
.ev{min-height:44px}
.tile{cursor:pointer;transition:fill-opacity .2s}
.tile:hover{fill-opacity:.5}
.dot{cursor:pointer}
#tip{position:absolute;pointer-events:none;background:#0d0b1f;border:1px solid var(--gold);border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.35;max-width:190px;text-align:center;opacity:0;transition:opacity .15s;z-index:3}
#tip b{display:block;font-weight:600}
#tip span{color:var(--gold)}
.hint{text-align:center;color:var(--mute);font-size:12px;margin:2px 0 10px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:12px;color:var(--mute);margin-bottom:14px}
.chips i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ring{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0}
.name{font-family:Cinzel,Georgia,serif;font-size:21px;margin:2px 0 0;color:var(--gold)}
.span{font-size:13px;color:var(--mute);margin:0 0 8px}
.mission{font-size:14px;margin:0}
.play{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:10px;padding:0 18px;border-radius:10px;background:var(--gold);color:#1a1405;font-weight:600;text-decoration:none}
.nav{display:flex;gap:8px;margin-top:12px}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--gold)}
.nav button{flex:1}
.ev{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer}
.ev:first-of-type{border-top:0}
.ev .d{width:9px;height:9px;border-radius:50%;flex:none;background:#fff}
.ev.cu .d{background:var(--gold)}
.ev .n{flex:1;font-size:14px}
.ev .y{font-size:13px;color:var(--gold);white-space:nowrap}
.ev.on{background:rgba(232,184,74,.1);border-radius:8px}
.ev .x{padding:0 6px;border:0;color:var(--mute);font-size:16px}
h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 6px;font-weight:500}
.empty{color:var(--mute);font-size:13px;margin:4px 0}
form{display:grid;grid-template-columns:1fr 110px;gap:8px}
input{font:inherit;color:var(--text);background:#0d0b1f;border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input:focus{outline:none;border-color:var(--gold)}
form button{grid-column:1/-1;background:var(--gold);color:#1a1405;border:0;font-weight:600}
#err{grid-column:1/-1;color:#ff8a98;font-size:12px;margin:0;min-height:0}
</style>
</head>
<body>
<div class="wrap">
<h1>DHARMASTRA</h1>
<p class="sub">Choose any moment in time</p>
<div class="stage" id="stage">
<svg id="svg" viewBox="0 0 400 400" role="img" aria-label="Dharmastra time chakra with five rings of eras around a center point">
<defs>
<radialGradient id="aura" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#e8b84a" stop-opacity=".22"/>
<stop offset=".55" stop-color="#6a4bd6" stop-opacity=".14"/>
<stop offset="1" stop-color="#0a0914" stop-opacity="0"/>
</radialGradient>
<linearGradient id="goldg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#ffe29a"/>
<stop offset="1" stop-color="#b9821f"/>
</linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="3" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<circle cx="200" cy="200" r="198" fill="url(#aura)"/>
<g id="decorOuter"></g>
<g id="tiles"></g>
<g id="decorInner"></g>
<g id="dots"></g>
</svg>
<div id="tip" role="status"></div>
</div>
<div class="tools">
<label class="sr" for="jump">Jump to an era</label>
<select id="jump"></select>
<button id="pz" aria-pressed="false">Pause rotation</button>
</div>
<div id="live" class="sr" aria-live="polite"></div>
<p class="hint">Tap a tile to light up its event dots, or use the era menu. Tap a dot for details.</p>
<div class="chips" id="chips"></div>

<div class="card">
<p class="ring" id="eRing"></p>
<p class="name" id="eName"></p>
<p class="span" id="eSpan"></p>
<p class="mission" id="eMission"></p>
<p class="span" id="playNote"></p>
<a id="play" class="play" href="../../index.html" hidden>Play this mission</a>
<div class="nav">
<button id="pv" aria-label="Earlier era">&#8592; Earlier</button>
<button id="nx" aria-label="Later era">Later &#8594;</button>
</div>
</div>

<div class="card">
<h3>Events on this tile</h3>
<div id="list"></div>
</div>

<div class="card">
<h3>Add an event dot</h3>
<form id="f">
<input id="in" maxlength="60" placeholder="Event name" aria-label="Event name">
<input id="iy" maxlength="14" placeholder="Year" aria-label="Year">
<p id="err"></p>
<button type="submit">Add dot to this tile</button>
</form>
</div>
</div>

<script>
var NS="http://www.w3.org/2000/svg",CX=200;
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function $(i){return document.getElementById(i)}

var RING=[
["Origin","#e8b84a"],
["Cosmic yugas","#8b6cf0"],
["Ancient India","#2fb596"],
["Medieval India","#f0993a"],
["Raj to today","#4f9bf0"],
["Far future","#e5516a"]];

var L="Legend";
var E=[
[0,"Shunya","Before creation","Drift through the void and follow the first sound to its source.",[["Nasadiya hymn asks who knows creation",L],["The first sound stirs",L]]],
[1,"Srishti","The creation","Ride the rising cosmic ocean as the first land forms.",[["The golden womb appears",L],["Brahma shapes the worlds",L]]],
[1,"Satya Yuga","Age of truth","Defend a shining city of dharma from the first spark of greed.",[["Churning of the ocean",L],["Narasimha slays Hiranyakashipu",L]]],
[1,"Treta Yuga","Age of the Ramayana","Chase a messenger through the forests of Dandaka.",[["Rama's exile begins",L],["The bridge to Lanka",L]]],
[1,"Dvapara Yuga","Age of the Mahabharata","Break out of Hastinapur by chariot before dawn.",[["The dice game at Hastinapur",L],["The Gita at Kurukshetra",L]]],
[2,"Indus Valley","c. 3300 BCE","Smuggle a cargo of beads through Mohenjo-daro at night.",[["Harappa and Mohenjo-daro peak","c. 2600 BCE"],["Dholavira's water systems","c. 2500 BCE"],["The cities decline","c. 1900 BCE"]]],
[2,"Vedic age","c. 1500 BCE","Outrun a rival clan across the Saptasindhu plains.",[["Rigveda composed","c. 1500 BCE"],["Iron-age towns rise on the Ganga","c. 1000 BCE"],["Early Upanishads composed","c. 800 BCE"]]],
[2,"Mahajanapadas","c. 600 BCE","Carry a secret treaty between rival kingdoms.",[["Magadha begins to rise","c. 6th c. BCE"],["Buddha and Mahavira teach","c. 5th c. BCE"],["Nandas take Magadha","c. 345 BCE"]]],
[2,"Mauryan empire","321 to 185 BCE","Escort a spy through the streets of Pataliputra.",[["Chandragupta takes Pataliputra","c. 321 BCE"],["Battle of Kalinga","c. 261 BCE"],["Ashoka's rock edicts","c. 250 BCE"]]],
[2,"Gupta empire","320 to 550 CE","Recover a stolen manuscript from a university city.",[["Chandragupta I founds the line","c. 320 CE"],["Nalanda is founded","c. 427 CE"],["Aryabhata writes the Aryabhatiya","499 CE"]]],
[3,"Chola empire","850 to 1279 CE","Command a war boat across the Bay of Bengal.",[["Rajaraja I is crowned","985 CE"],["Brihadisvara Temple consecrated","1010 CE"],["Naval raid on Srivijaya","1025 CE"]]],
[3,"Rajput kingdoms","750 to 1200 CE","Hold a hill fort gate through a night siege.",[["First Battle of Tarain","1191 CE"],["Second Battle of Tarain","1192 CE"],["Siege of Chittorgarh","1303 CE"]]],
[3,"Delhi Sultanate","1206 to 1526 CE","Slip through a crowded bazaar with a royal decree.",[["The Sultanate is founded","1206 CE"],["Razia Sultan takes the throne","1236 CE"],["Timur sacks Delhi","1398 CE"]]],
[3,"Vijayanagara","1336 to 1646 CE","Win a chariot race through Hampi's stone streets.",[["The empire is founded","1336 CE"],["Krishnadevaraya is crowned","1509 CE"],["Battle of Talikota","1565 CE"]]],
[3,"Mughal empire","1526 to 1857 CE","Trail a smuggler through Agra's walled lanes.",[["First Battle of Panipat","1526 CE"],["Akbar is crowned","1556 CE"],["Taj Mahal construction begins","1632 CE"],["Aurangzeb takes the throne","1658 CE"]]],
[3,"Maratha empire","1674 to 1818 CE","Scale a sea fort and raid it by dawn.",[["Treaty of Purandar","1665 CE"],["Shivaji is crowned at Raigad","1674 CE"],["Third Battle of Panipat","1761 CE"]]],
[4,"Company Raj","1757 to 1858 CE","Intercept a payroll train crossing the plains.",[["Battle of Plassey","1757 CE"],["Battle of Buxar","1764 CE"],["Doctrine of Lapse begins","1848 CE"]]],
[4,"Revolt of 1857","1857 CE","Carry a message between rebel camps under fire.",[["Mangal Pandey at Barrackpore","1857 CE"],["Meerut uprising","1857 CE"],["Jhansi falls","1858 CE"]]],
[4,"Freedom struggle","1905 to 1947 CE","Run a pamphlet network through a city under curfew.",[["Partition of Bengal","1905 CE"],["Jallianwala Bagh","1919 CE"],["Dandi March","1930 CE"],["Quit India movement","1942 CE"]]],
[4,"Independent India","1947 to 1991 CE","Drive a refugee convoy across a new border.",[["Independence","1947 CE"],["Constitution comes into force","1950 CE"],["Bangladesh Liberation War","1971 CE"]]],
[4,"Digital India","1991 to today","Chase a data thief through a neon-lit metro.",[["Economic reforms begin","1991 CE"],["UPI is launched","2016 CE"],["Chandrayaan-3 lands near the lunar south pole","2023 CE"]]],
[5,"Kalki","The age's end","Ride through a burning city to hold the last line.",[["Kalki avatar foretold",L]]],
[5,"Pralaya","The great dissolution","Outrun the folding world as time collapses inward.",[["The worlds dissolve",L]]]
];

var cnt=[0,0,0,0,0,0],seen=[0,0,0,0,0,0];
E.forEach(function(d){cnt[d[0]]++});

function pt(r,a){return (CX+r*Math.cos(a)).toFixed(2)+" "+(CX+r*Math.sin(a)).toFixed(2)}

var G=E.map(function(d){
var k=d[0],n=cnt[k],j=seen[k]++;
if(k==0)return {k:0,r1:0,r2:17,rc:0,a0:0,a1:Math.PI*2,c:true};
var r1=54+(k-1)*21.5,r2=r1+18.5,sw=Math.PI*2/n,gap=0.03;
return {k:k,r1:r1,r2:r2,rc:(r1+r2)/2,a0:-Math.PI/2+j*sw+gap,a1:-Math.PI/2+(j+1)*sw-gap};
});

var dO=$("decorOuter"),dI=$("decorInner"),tg=$("tiles"),dg=$("dots");

(function(){
var s1=el("g",{"class":"spin"},dO);
el("circle",{cx:CX,cy:CX,r:196,fill:"none",stroke:"url(#goldg)","stroke-width":1.2,"stroke-dasharray":"2 5"},s1);
for(var i=0;i<36;i++){
var g=el("g",{transform:"rotate("+(i*10)+" 200 200)"},s1);
el("path",{d:"M200 2 L203 8 L200 14 L197 8 Z",fill:"url(#goldg)",opacity:.85},g);
}
var s2=el("g",{"class":"spin rev slow"},dO);
for(var j=0;j<24;j++){
var p=el("g",{transform:"rotate("+(j*15)+" 200 200)"},s2);
el("path",{d:"M200 16 Q208 28 200 40 Q192 28 200 16 Z",fill:"#e8b84a","fill-opacity":.12,stroke:"url(#goldg)","stroke-width":.9},p);
}
el("circle",{cx:CX,cy:CX,r:164,fill:"none",stroke:"#e8b84a","stroke-opacity":.5,"stroke-width":.8},dO);
el("circle",{cx:CX,cy:CX,r:51,fill:"none",stroke:"#e8b84a","stroke-opacity":.5,"stroke-width":.8},dO);
})();

(function(){
var s1=el("g",{"class":"spin rev"},dI);
for(var i=0;i<12;i++){
var g=el("g",{transform:"rotate("+(i*30)+" 200 200)"},s1);
el("ellipse",{cx:200,cy:166,rx:5.5,ry:13,fill:"#8b6cf0","fill-opacity":.16,stroke:"url(#goldg)","stroke-width":.9},g);
}
var s2=el("g",{"class":"spin"},dI);
el("circle",{cx:CX,cy:CX,r:47,fill:"none",stroke:"url(#goldg)","stroke-width":1,"stroke-dasharray":"1 4"},s2);
for(var m=0;m<8;m++){
var h=el("g",{transform:"rotate("+(m*45)+" 200 200)"},s2);
el("path",{d:"M200 156 L204 164 L200 172 L196 164 Z",fill:"url(#goldg)"},h);
}
})();

var tiles=[];
E.forEach(function(d,i){
var g=G[i],c=RING[d[0]][1],e;
if(g.c){e=el("circle",{cx:CX,cy:CX,r:g.r2,"class":"tile"},tg)}
else{
e=el("path",{d:"M"+pt(g.r2,g.a0)+" A"+g.r2+" "+g.r2+" 0 0 1 "+pt(g.r2,g.a1)+" L"+pt(g.r1,g.a1)+" A"+g.r1+" "+g.r1+" 0 0 0 "+pt(g.r1,g.a0)+" Z","class":"tile"},tg);
}
e.setAttribute("role","button");
e.setAttribute("aria-label",d[1]);
e.setAttribute("tabindex","0");
e.addEventListener("click",function(){sel(i)});
e.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();sel(i)}});
tiles.push(e);
});

var chips=$("chips");
RING.forEach(function(r){
var s=document.createElement("span");
var i=document.createElement("i");i.style.background=r[1];
s.appendChild(i);s.appendChild(document.createTextNode(r[0]));
chips.appendChild(s);
});

var custom={};
try{var raw=localStorage.getItem("dharmastra_custom");if(raw)custom=JSON.parse(raw)||{}}catch(x){custom={}}
function save(){try{localStorage.setItem("dharmastra_custom",JSON.stringify(custom))}catch(x){}}

var cur=14,curEv=-1,dotEls=[];
var MISSIONS={4:"../../index.html"};

function events(i){return E[i][4].concat(custom[i]||[])}

function renderDots(){
dg.textContent="";dotEls=[];
var i=cur,g=G[i],evs=events(i),m=evs.length,col=RING[E[i][0]][1];
evs.forEach(function(ev,j){
var a,r;
if(g.c){a=-Math.PI/2+j*Math.PI*2/m;r=30}
else{a=g.a0+(j+1)/(m+1)*(g.a1-g.a0);r=g.rc}
var x=CX+r*Math.cos(a),y=CX+r*Math.sin(a);
var isCu=j>=E[i][4].length;
var grp=el("g",{"class":"dot",role:"button","aria-label":ev[0]+", "+ev[1],tabindex:"0"},dg);
el("circle",{cx:x,cy:y,r:7,fill:isCu?"#e8b84a":"#fff","class":"halo"},grp);
var dot=el("circle",{cx:x,cy:y,r:3.4,fill:isCu?"#e8b84a":"#fff",stroke:col,"stroke-width":1.4,filter:"url(#glow)"},grp);
el("circle",{cx:x,cy:y,r:11,fill:"transparent"},grp);
grp.addEventListener("click",function(e){e.stopPropagation();pick(j)});
grp.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(j)}});
dotEls.push({g:grp,dot:dot,x:x,y:y});
});
}

function renderList(){
var box=$("list");box.textContent="";
var evs=events(cur),base=E[cur][4].length;
if(!evs.length){var p=document.createElement("p");p.className="empty";p.textContent="No events yet. Add the first one below.";box.appendChild(p);return}
evs.forEach(function(ev,j){
var row=document.createElement("div");row.className="ev"+(j>=base?" cu":"")+(j===curEv?" on":"");
row.setAttribute("role","button");row.setAttribute("tabindex","0");row.setAttribute("aria-label",ev[0]+", "+ev[1]);
row.addEventListener("keydown",function(e){if(e.target===row&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pick(j)}});
var d=document.createElement("span");d.className="d";
var n=document.createElement("span");n.className="n";n.textContent=ev[0];
var y=document.createElement("span");y.className="y";y.textContent=ev[1];
row.appendChild(d);row.appendChild(n);row.appendChild(y);
if(j>=base){
var x=document.createElement("button");x.className="x";x.textContent="×";x.setAttribute("aria-label","Remove "+ev[0]);
x.addEventListener("click",function(e){e.stopPropagation();custom[cur].splice(j-base,1);save();curEv=-1;hideTip();renderDots();renderList()});
row.appendChild(x);
}
row.addEventListener("click",function(){pick(j)});
box.appendChild(row);
});
}

function hideTip(){$("tip").style.opacity=0}

function pick(j){
curEv=j;
dotEls.forEach(function(o,k){o.dot.setAttribute("r",k===j?5.4:3.4);o.dot.setAttribute("stroke-width",k===j?2.4:1.4)});
var ev=events(cur)[j],o=dotEls[j];
var tip=$("tip");tip.textContent="";
var b=document.createElement("b");b.textContent=ev[0];
var s=document.createElement("span");s.textContent=ev[1];
tip.appendChild(b);tip.appendChild(s);
var st=$("stage"),sr=st.getBoundingClientRect(),dr=o.dot.getBoundingClientRect();
var left=dr.left+dr.width/2-sr.left,top=dr.top-sr.top-8;
var half=95;left=Math.max(half,Math.min(sr.width-half,left));
tip.style.left=left+"px";tip.style.top=top+"px";
tip.style.transform="translate(-50%,-100%)";
tip.style.opacity=1;
renderList();
}

function sel(i){
cur=i;curEv=-1;hideTip();
tiles.forEach(function(e,j){
var c=RING[E[j][0]][1],on=j===i;
e.setAttribute("fill",c);
e.setAttribute("fill-opacity",on?.85:.24);
e.setAttribute("stroke",on?"#fff":c);
e.setAttribute("stroke-opacity",on?1:.95);
e.setAttribute("stroke-width",on?1.6:.8);
if(on){e.setAttribute("filter","url(#glow)");e.parentNode.appendChild(e)}else{e.removeAttribute("filter")}
});
var d=E[i];
$("eRing").textContent=RING[d[0]][0];
$("eName").textContent=d[1];
$("eSpan").textContent=d[2];
$("eMission").textContent="Mission hook: "+d[3];
$("jump").value=String(i);
var pl=$("play");pl.hidden=!MISSIONS[i];if(MISSIONS[i]){pl.href=MISSIONS[i];pl.textContent="Play: Escape from Hastinapur"}
$("playNote").textContent=MISSIONS[i]?"A playable mission is ready.":"No playable mission here yet.";
$("live").textContent=d[1]+", "+d[2]+". "+events(i).length+" events.";
renderDots();renderList();
}

(function(){
var jp=$("jump"),grp=null,last=-1;
E.forEach(function(d,i){
if(d[0]!==last){grp=document.createElement("optgroup");grp.label=RING[d[0]][0];jp.appendChild(grp);last=d[0]}
var o=document.createElement("option");o.value=String(i);o.textContent=d[1]+" ("+d[2]+")";grp.appendChild(o);
});
jp.addEventListener("change",function(){sel(parseInt(jp.value,10))});
var pz=$("pz"),st=$("stage"),reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function setP(p){st.classList.toggle("paused",p);pz.setAttribute("aria-pressed",p?"true":"false");pz.textContent=p?"Resume rotation":"Pause rotation"}
pz.addEventListener("click",function(){setP(!st.classList.contains("paused"))});
if(reduce)setP(true);
})();
$("pv").addEventListener("click",function(){sel((cur+E.length-1)%E.length)});
$("nx").addEventListener("click",function(){sel((cur+1)%E.length)});

$("f").addEventListener("submit",function(e){
e.preventDefault();
var n=$("in").value.trim(),y=$("iy").value.trim(),er=$("err");
if(!n){er.textContent="Enter an event name.";return}
if(!y){er.textContent="Enter a year.";return}
er.textContent="";
if(!custom[cur])custom[cur]=[];
custom[cur].push([n,y]);save();
$("in").value="";$("iy").value="";
curEv=-1;hideTip();renderDots();renderList();
});
$("in").addEventListener("input",function(){$("err").textContent=""});
$("iy").addEventListener("input",function(){$("err").textContent=""});

sel(14);
</script>
</body>
</html>
